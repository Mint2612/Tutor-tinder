# Isolated browser-test stack. Use with -p tutormatch-e2e and --env-file .env.example.
services:
  db:
    ports: !reset []
    volumes: !reset []
    tmpfs:
      - /var/lib/mysql
  backend:
    ports: !override
      - "127.0.0.1:38080:8080"
    environment:
      COOKIE_SECURE: "false"
      APP_PUBLIC_URL: http://127.0.0.1:33000
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_AUTH: "false"
      MAIL_STARTTLS: "false"
      MAIL_SSL: "false"
      # Browser workflows use deterministic matching; live local inference is checked separately.
      LLM_URL: ${E2E_LLM_URL:-}
      ADMIN_EMAIL: e2e-admin@example.test
      ADMIN_PASSWORD: e2e-admin-password-12345
  frontend:
    ports: !override
      - "127.0.0.1:33000:80"
  mailpit:
    ports: !override
      - "127.0.0.1:38025:8025"
