services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DATABASE_NAME:-tutormatch}
      MARIADB_USER: ${DATABASE_USER:-tutormatch}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:?Copy .env.example to .env first}
      MARIADB_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?Set DATABASE_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    profiles: [app]
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME:-tutormatch}
      DATABASE_USER: ${DATABASE_USER:-tutormatch}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@tutormatch.local}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_SSL: ${MAIL_SSL:-false}
      LLM_URL: ${LLM_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-tutormatch}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-tutormatch_minio_dev}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-gemini-embedding-001}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_started
  frontend:
    profiles: [app]
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
  mailpit:
    profiles: [app]
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
  # Local object storage for tutor avatars and private identity evidence. Both buckets are created
  # by the backend on first use and stay private; files are only reachable through the API.
  # The official minio/minio image is no longer published, so this pins a community-maintained
  # fork that keeps the same server command and MINIO_ROOT_* settings.
  minio:
    profiles: [app]
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tutormatch}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tutormatch_minio_dev}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
  test-db:
    profiles: [test]
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: tutormatch_test
      MARIADB_USER: tutormatch
      MARIADB_PASSWORD: test_password
      MARIADB_ROOT_PASSWORD: test_root_password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend-test:
    profiles: [test]
    build:
      context: ./backend
      target: test
    environment:
      DB_HOST: test-db
      DATABASE_NAME: tutormatch_test
      DATABASE_USER: tutormatch
      DATABASE_PASSWORD: test_password
    command: ["./mvnw", "-B", "verify"]
    volumes:
      - maven_test_cache:/root/.m2
    depends_on:
      test-db:
        condition: service_healthy
volumes:
  mariadb_data:
  minio_data:
  maven_test_cache: