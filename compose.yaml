services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DATABASE_NAME:-tutormatch}
      MARIADB_USER: ${DATABASE_USER:-tutormatch}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:?Copy .env.example to .env first}
      MARIADB_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?Set DATABASE_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    profiles: [app]
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME:-tutormatch}
      DATABASE_USER: ${DATABASE_USER:-tutormatch}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      SPRING_PROFILES_ACTIVE: demo
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    profiles: [app]
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
  test-db:
    profiles: [test]
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: tutormatch_test
      MARIADB_USER: tutormatch
      MARIADB_PASSWORD: test_password
      MARIADB_ROOT_PASSWORD: test_root_password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend-test:
    profiles: [test]
    build:
      context: ./backend
      target: build
    environment:
      DB_HOST: test-db
      DATABASE_NAME: tutormatch_test
      DATABASE_USER: tutormatch
      DATABASE_PASSWORD: test_password
    command: ["./mvnw", "-B", "verify"]
    depends_on:
      test-db:
        condition: service_healthy
volumes:
  mariadb_data:
