services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DATABASE_NAME:-tutormatch}
      MARIADB_USER: ${DATABASE_USER:-tutormatch}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:?Copy .env.example to .env first}
      MARIADB_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?Set DATABASE_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    profiles: [app]
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME:-tutormatch}
      DATABASE_USER: ${DATABASE_USER:-tutormatch}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@tutormatch.local}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_SSL: ${MAIL_SSL:-false}
      LLM_URL: ${LLM_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
  frontend:
    profiles: [app]
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
  mailpit:
    profiles: [app]
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
  test-db:
    profiles: [test]
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: tutormatch_test
      MARIADB_USER: tutormatch
      MARIADB_PASSWORD: test_password
      MARIADB_ROOT_PASSWORD: test_root_password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend-test:
    profiles: [test]
    build:
      context: ./backend
      target: test
    environment:
      DB_HOST: test-db
      DATABASE_NAME: tutormatch_test
      DATABASE_USER: tutormatch
      DATABASE_PASSWORD: test_password
    command: ["./mvnw", "-B", "verify"]
    volumes:
      - maven_test_cache:/root/.m2
    depends_on:
      test-db:
        condition: service_healthy
volumes:
  mariadb_data:
  maven_test_cache:
